<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f000d"/>
      <stop offset="100%" stop-color="#0d0004"/>
    </linearGradient>
    <linearGradient id="cabinet-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0010"/>
      <stop offset="100%" stop-color="#0f0004"/>
    </linearGradient>
    <radialGradient id="coin-face" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#fffde8"/>
      <stop offset="18%"  stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#ffd700"/>
      <stop offset="82%"  stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a5200"/>
    </radialGradient>
    <linearGradient id="lever-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#444"/>
      <stop offset="38%"  stop-color="#ccc"/>
      <stop offset="62%"  stop-color="#ccc"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <radialGradient id="ball-red" cx="35%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#ff9999"/>
      <stop offset="45%"  stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
  </defs>

  <!-- Background: game's red -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Cabinet body — centered, ~60% of canvas, shifted left to make room for handle -->
  <rect x="136" y="106" width="200" height="300" rx="26" fill="url(#cabinet-grad)"/>
  <!-- Outer gold border -->
  <rect x="136" y="106" width="200" height="300" rx="26" fill="none" stroke="#ffd700" stroke-width="9"/>
  <!-- Inner decorative border -->
  <rect x="151" y="121" width="170" height="270" rx="17" fill="none" stroke="#b8860b" stroke-width="2.5"/>

  <!-- Gold coin — coin diameter is ~50% of cabinet width -->
  <!-- Shadow -->
  <ellipse cx="238" cy="272" rx="52" ry="8" fill="#000" opacity="0.4"/>
  <!-- Outer rim -->
  <circle cx="236" cy="258" r="58" fill="#7a5a00"/>
  <!-- Rim highlight -->
  <circle cx="236" cy="258" r="58" fill="none" stroke="#ffd700" stroke-width="5" opacity="0.55"/>
  <!-- Coin face -->
  <circle cx="236" cy="258" r="51" fill="url(#coin-face)"/>
  <!-- Inner ring -->
  <circle cx="236" cy="258" r="44" fill="none" stroke="#9a7200" stroke-width="3.5"/>
  <!-- $ sign -->
  <text x="239" y="281"
        text-anchor="middle"
        font-size="58"
        font-weight="bold"
        font-family="Georgia,'Times New Roman',serif"
        fill="#7a5200"
        opacity="0.55">$</text>
  <text x="236" y="278"
        text-anchor="middle"
        font-size="58"
        font-weight="bold"
        font-family="Georgia,'Times New Roman',serif"
        fill="#fffde0">$</text>

  <!-- Handle bracket (right edge of cabinet) -->
  <rect x="322" y="192" width="28" height="84" rx="10" fill="#555"/>
  <rect x="324" y="194" width="24" height="80" rx="8" fill="#999"/>
  <!-- Bolts -->
  <circle cx="336" cy="206" r="4" fill="#555"/>
  <circle cx="336" cy="262" r="4" fill="#555"/>

  <!-- Lever arm -->
  <rect x="332" y="78" width="14" height="126" rx="6" fill="url(#lever-metal)"/>

  <!-- Lever ball -->
  <circle cx="339" cy="70" r="26" fill="url(#ball-red)"/>
  <!-- Ball shine -->
  <ellipse cx="331" cy="62" rx="9" ry="7" fill="white" opacity="0.28"/>
</svg>
