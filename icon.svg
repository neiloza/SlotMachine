<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cabinet-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0018"/>
      <stop offset="100%" stop-color="#0d0005"/>
    </linearGradient>
    <radialGradient id="coin-face" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#fffde0"/>
      <stop offset="20%"  stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#ffd700"/>
      <stop offset="82%"  stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a5200"/>
    </radialGradient>
    <linearGradient id="lever-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#444"/>
      <stop offset="35%"  stop-color="#ccc"/>
      <stop offset="65%"  stop-color="#ccc"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <radialGradient id="ball-red" cx="35%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#ff9999"/>
      <stop offset="45%"  stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <radialGradient id="gold-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#a07000"/>
    </radialGradient>
  </defs>

  <!-- Cabinet body -->
  <rect x="14" y="14" width="358" height="484" rx="46" fill="url(#cabinet-bg)"/>

  <!-- Outer gold border -->
  <rect x="14" y="14" width="358" height="484" rx="46" fill="none" stroke="#ffd700" stroke-width="10"/>

  <!-- Inner decorative border -->
  <rect x="32" y="32" width="322" height="448" rx="32" fill="none" stroke="#b8860b" stroke-width="3"/>

  <!-- Coin drop shadow -->
  <ellipse cx="194" cy="274" rx="138" ry="16" fill="#000" opacity="0.4"/>

  <!-- Coin outer rim (darker gold ring) -->
  <circle cx="192" cy="255" r="144" fill="#8b6000"/>

  <!-- Coin reeded edge highlight -->
  <circle cx="192" cy="255" r="144" fill="none" stroke="#ffd700" stroke-width="6" opacity="0.6"/>

  <!-- Coin main face -->
  <circle cx="192" cy="255" r="132" fill="url(#coin-face)"/>

  <!-- Coin inner ring -->
  <circle cx="192" cy="255" r="116" fill="none" stroke="#a07800" stroke-width="5"/>

  <!-- Coin dollar sign (shadow) -->
  <text x="195" y="304"
        text-anchor="middle"
        font-size="148"
        font-weight="bold"
        font-family="Georgia, 'Times New Roman', serif"
        fill="#7a5200"
        opacity="0.55">$</text>

  <!-- Coin dollar sign (main) -->
  <text x="192" y="300"
        text-anchor="middle"
        font-size="148"
        font-weight="bold"
        font-family="Georgia, 'Times New Roman', serif"
        fill="#fffde0">$</text>

  <!-- Handle bracket (bolted to right edge of cabinet) -->
  <rect x="355" y="202" width="42" height="126" rx="14" fill="#555"/>
  <rect x="357" y="204" width="38" height="122" rx="12" fill="#999"/>
  <!-- Bracket bolts -->
  <circle cx="376" cy="218" r="5" fill="#555"/>
  <circle cx="376" cy="310" r="5" fill="#555"/>

  <!-- Lever arm -->
  <rect x="374" y="50" width="20" height="175" rx="9" fill="url(#lever-metal)"/>

  <!-- Lever ball -->
  <circle cx="384" cy="42" r="36" fill="url(#ball-red)"/>
  <!-- Ball shine -->
  <ellipse cx="374" cy="32" rx="11" ry="8" fill="white" opacity="0.3"/>
</svg>
