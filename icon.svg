<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE050"/>
      <stop offset="40%"  stop-color="#F0B800"/>
      <stop offset="100%" stop-color="#B87800"/>
    </linearGradient>
    <linearGradient id="marquee-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18183a"/>
      <stop offset="100%" stop-color="#0a0a22"/>
    </linearGradient>
    <linearGradient id="reel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f6f6"/>
      <stop offset="100%" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="lever-rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#444"/>
      <stop offset="38%"  stop-color="#ccc"/>
      <stop offset="62%"  stop-color="#ccc"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <radialGradient id="lever-ball" cx="35%" cy="30%" r="66%">
      <stop offset="0%"   stop-color="#ff9999"/>
      <stop offset="50%"  stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
    <linearGradient id="bracket-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B6000"/>
      <stop offset="50%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </linearGradient>
  </defs>

  <!-- Red background -->
  <rect width="512" height="512" fill="#CC1111"/>

  <!-- Cabinet drop shadow -->
  <rect x="84" y="72" width="295" height="392" rx="20" fill="#000" opacity="0.25"/>

  <!-- Cabinet body -->
  <rect x="78" y="65" width="295" height="392" rx="20" fill="url(#cabinet)"/>
  <!-- Dark outer border (for definition against gold cabinet) -->
  <rect x="78" y="65" width="295" height="392" rx="20" fill="none" stroke="#3A2000" stroke-width="7"/>
  <!-- Inner decorative border -->
  <rect x="91" y="78" width="269" height="366" rx="14" fill="none" stroke="#7A5000" stroke-width="2"/>

  <!-- Marquee area -->
  <rect x="93" y="80" width="265" height="76" rx="12" fill="url(#marquee-bg)"/>
  <rect x="93" y="80" width="265" height="76" rx="12" fill="none" stroke="#FFD700" stroke-width="2"/>

  <!-- Marquee lights (alternating colors) -->
  <circle cx="112" cy="95"  r="7.5" fill="#FFE500"/>
  <circle cx="138" cy="89"  r="7.5" fill="#FF6600"/>
  <circle cx="167" cy="86"  r="7.5" fill="#FFE500"/>
  <circle cx="197" cy="85"  r="7.5" fill="#FF4444"/>
  <circle cx="225" cy="84"  r="7.5" fill="#FFE500"/>
  <circle cx="254" cy="85"  r="7.5" fill="#FF6600"/>
  <circle cx="283" cy="86"  r="7.5" fill="#FFE500"/>
  <circle cx="312" cy="89"  r="7.5" fill="#FF4444"/>
  <circle cx="338" cy="95"  r="7.5" fill="#FFE500"/>

  <!-- SLOTS text -->
  <text x="225" y="146"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="44"
        font-weight="900"
        fill="#FFD700"
        letter-spacing="6">SLOTS</text>

  <!-- Reel window chrome frame -->
  <rect x="94" y="170" width="261" height="148" rx="9" fill="#6a6a6a"/>
  <rect x="97" y="173" width="255" height="142" rx="7" fill="#444"/>
  <!-- Reel window (light background) -->
  <rect x="100" y="176" width="249" height="136" rx="5" fill="url(#reel-bg)"/>

  <!-- Reel dividers -->
  <rect x="183" y="176" width="5" height="136" fill="#aaa"/>
  <rect x="267" y="176" width="5" height="136" fill="#aaa"/>

  <!-- Payline triangles (left and right) -->
  <polygon points="88,244 97,236 97,252" fill="#FF4444"/>
  <polygon points="363,244 354,236 354,252" fill="#FF4444"/>
  <!-- Payline (subtle dashed) -->
  <line x1="100" y1="244" x2="352" y2="244" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="7,5" opacity="0.45"/>

  <!-- ===== REEL SYMBOLS: Triple 7 ===== -->
  <!-- Each reel inner width: 249/3 = 83px -->
  <!-- Reel 1 center x: 100 + 41.5 = 141.5  -->
  <!-- Reel 2 center x: 100 + 83 + 41.5 = 224.5 -->
  <!-- Reel 3 center x: 100 + 166 + 41.5 = 307.5 -->
  <!-- Reel vertical center: 176 + 68 = 244; baseline ~244+28=272 -->

  <!-- Reel 1: "7" shadow then fill -->
  <text x="144" y="273"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#7a0000">7</text>
  <text x="141" y="270"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#DD0000">7</text>

  <!-- Reel 2: "7" shadow then fill -->
  <text x="227" y="273"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#7a0000">7</text>
  <text x="224" y="270"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#DD0000">7</text>

  <!-- Reel 3: "7" shadow then fill -->
  <text x="311" y="273"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#7a0000">7</text>
  <text x="308" y="270"
        text-anchor="middle"
        font-family="'Arial Black', Impact, 'sans-serif'"
        font-size="76"
        font-weight="900"
        fill="#DD0000">7</text>

  <!-- Coin slot -->
  <rect x="181" y="334" width="88" height="12" rx="6" fill="#111" stroke="#555" stroke-width="1.5"/>

  <!-- Bottom decorative panel -->
  <rect x="94" y="358" width="261" height="78" rx="8" fill="#0c0c22" stroke="#B8860B" stroke-width="1.5"/>
  <!-- Stars -->
  <text x="225" y="408"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="#FFD700">★  ★  ★</text>

  <!-- Coin tray -->
  <rect x="108" y="446" width="235" height="17" rx="7" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>

  <!-- Handle bracket (right side of cabinet) -->
  <rect x="373" y="218" width="30" height="92" rx="10" fill="#5A3A00"/>
  <rect x="375" y="220" width="26" height="88" rx="8" fill="url(#bracket-metal)"/>
  <!-- Bracket bolts -->
  <circle cx="388" cy="233" r="5"   fill="#3A2000"/>
  <circle cx="388" cy="233" r="3"   fill="#C8960C"/>
  <circle cx="388" cy="297" r="5"   fill="#3A2000"/>
  <circle cx="388" cy="297" r="3"   fill="#C8960C"/>

  <!-- Lever rod -->
  <rect x="382" y="113" width="13" height="109" rx="6" fill="url(#lever-rod)"/>

  <!-- Lever ball -->
  <circle cx="388" cy="103" r="27" fill="url(#lever-ball)"/>
  <!-- Ball shine -->
  <ellipse cx="379" cy="94" rx="9" ry="7" fill="white" opacity="0.26"/>
</svg>
