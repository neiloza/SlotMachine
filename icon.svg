<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE454"/>
      <stop offset="50%"  stop-color="#F0B800"/>
      <stop offset="100%" stop-color="#B87800"/>
    </linearGradient>
    <linearGradient id="cab-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4A000"/>
      <stop offset="100%" stop-color="#A87800"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFDE8"/>
      <stop offset="100%" stop-color="#EDE0A0"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8B6000"/>
      <stop offset="40%"  stop-color="#FFD700"/>
      <stop offset="60%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B6000"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#ff9999"/>
      <stop offset="50%"  stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
  </defs>

  <!-- Red background -->
  <rect width="512" height="512" fill="#CC1111"/>

  <!-- Cabinet body -->
  <rect x="85" y="68" width="288" height="376" rx="20" fill="url(#cab)"/>
  <!-- Darker top band (marquee) — same rounded top as cabinet -->
  <path d="M105,68 A20,20,0,0,0,85,88 L85,148 L373,148 L373,88 A20,20,0,0,0,353,68 Z"
        fill="url(#cab-top)"/>
  <!-- Separator line -->
  <line x1="85" y1="148" x2="373" y2="148" stroke="#3A2000" stroke-width="3"/>
  <!-- Cabinet outline -->
  <rect x="85" y="68" width="288" height="376" rx="20" fill="none" stroke="#3A2000" stroke-width="5"/>

  <!-- Reel window (cream) -->
  <rect x="105" y="168" width="248" height="152" rx="8" fill="url(#reel)"/>

  <!-- Triple 7 in gold -->
  <!-- Reel centers: 105 + 248/6 = 146, 105 + 248/2 = 229, 105 + 248*5/6 = 312 -->
  <!-- Vertical center: 168 + 76 = 244; baseline ≈ 244 + 29 = 273 -->

  <text x="149" y="273" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#5A3A00">7</text>
  <text x="146" y="270" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#FFD700">7</text>

  <text x="232" y="273" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#5A3A00">7</text>
  <text x="229" y="270" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#FFD700">7</text>

  <text x="315" y="273" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#5A3A00">7</text>
  <text x="312" y="270" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="82" font-weight="900" fill="#FFD700">7</text>

  <!-- Lever bracket -->
  <rect x="373" y="220" width="28" height="86" rx="9" fill="#5A3A00"/>
  <rect x="375" y="222" width="24" height="82" rx="7" fill="url(#rod)"/>

  <!-- Lever rod -->
  <rect x="381" y="130" width="12" height="92" rx="5" fill="url(#rod)"/>

  <!-- Lever ball -->
  <circle cx="387" cy="108" r="26" fill="url(#ball)"/>
  <ellipse cx="379" cy="100" rx="8" ry="6" fill="white" opacity="0.25"/>
</svg>
