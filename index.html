<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#150109" />
  <title>Lucky Gold Slots</title>
  <meta name="description" content="A free, ad-free slot machine with a built-in click-to-earn gold mine. A healthier alternative to predatory slot games — no microtransactions, no manipulation." />
  <link rel="canonical" href="https://slotmachine.thewizardofoza.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lucky Gold Slots" />
  <meta property="og:description" content="A free, ad-free slot machine with a built-in click-to-earn gold mine. No microtransactions, no manipulation." />
  <meta property="og:url" content="https://slotmachine.thewizardofoza.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lucky Gold Slots" />
  <meta name="twitter:description" content="A free, ad-free slot machine with a built-in click-to-earn gold mine." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lucky Slots" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="style.css?v=4" />
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("luckyGoldSlots:v1");
        if (!raw) return;
        var data = JSON.parse(raw);
        var allowed = ["vegas", "cozy", "neon", "forest", "red-carpet"];
        if (data && allowed.indexOf(data.theme) >= 0) {
          document.documentElement.setAttribute("data-theme", data.theme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="bg-lights" aria-hidden="true"></div>

  <main id="slot-screen" class="screen active">
    <header class="topbar">
      <h1 class="neon-title">Lucky Gold Slots</h1>
      <div class="balance-pill" aria-live="polite">
        <span class="coin-icon" aria-hidden="true"></span>
        <span id="balance">0</span>
      </div>
    </header>

    <div class="theme-bar">
      <label for="theme-select">Theme</label>
      <select id="theme-select" aria-label="Choose visual theme">
        <option value="vegas">Classic Vegas</option>
        <option value="cozy">Cozy Wood</option>
        <option value="neon">Neon Nights</option>
        <option value="forest">Forest</option>
        <option value="red-carpet">Red Carpet</option>
      </select>
    </div>

    <section class="cabinet">
      <div class="cabinet-trim top-trim"></div>

      <div class="reels-frame">
        <svg class="paylines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
          <line class="payline" data-line="row-top"    x1="0" y1="50"  x2="300" y2="50" />
          <line class="payline" data-line="row-mid"    x1="0" y1="150" x2="300" y2="150" />
          <line class="payline" data-line="row-bot"    x1="0" y1="250" x2="300" y2="250" />
          <line class="payline" data-line="diag-tl-br" x1="50" y1="50"  x2="250" y2="250" />
          <line class="payline" data-line="diag-bl-tr" x1="50" y1="250" x2="250" y2="50" />
        </svg>

        <div class="reels" id="reels">
          <div class="reel" data-reel="0">
            <div class="cell" data-row="0"></div>
            <div class="cell" data-row="1"></div>
            <div class="cell" data-row="2"></div>
          </div>
          <div class="reel" data-reel="1">
            <div class="cell" data-row="0"></div>
            <div class="cell" data-row="1"></div>
            <div class="cell" data-row="2"></div>
          </div>
          <div class="reel" data-reel="2">
            <div class="cell" data-row="0"></div>
            <div class="cell" data-row="1"></div>
            <div class="cell" data-row="2"></div>
          </div>
        </div>
      </div>

      <div class="display-row">
        <div class="display-box">
          <div class="display-label">Last Win</div>
          <div class="display-value" id="last-win">0</div>
        </div>
        <div class="display-box">
          <div class="display-label">Bet</div>
          <div class="display-value" id="total-bet">1</div>
        </div>
      </div>

      <div class="controls">
        <div class="control-group">
          <div class="control-label">Lines</div>
          <div class="btn-row" role="radiogroup" aria-label="Coins to bet">
            <button class="bet-btn active" data-bet="1" role="radio" aria-checked="true">1<small>coin</small></button>
            <button class="bet-btn" data-bet="2" role="radio" aria-checked="false">2<small>coins</small></button>
            <button class="bet-btn" data-bet="3" role="radio" aria-checked="false">3<small>coins</small></button>
          </div>
          <div class="control-hint" id="lines-hint">Middle row only</div>
        </div>

        <div class="control-group">
          <div class="control-label">Multiplier</div>
          <div class="btn-row" role="radiogroup" aria-label="Bet multiplier">
            <button class="mult-btn active" data-mult="1" role="radio" aria-checked="true">1x</button>
            <button class="mult-btn" data-mult="3" role="radio" aria-checked="false">3x</button>
            <button class="mult-btn" data-mult="5" role="radio" aria-checked="false">5x</button>
            <button class="mult-btn" data-mult="10" role="radio" aria-checked="false">10x</button>
          </div>
          <div class="control-hint">Multiplies cost and payout</div>
        </div>

        <button id="get-gold-btn" class="get-gold-btn">
          Get More Gold
        </button>

        <button id="spin-btn" class="spin-btn">
          <span class="spin-text">SPIN</span>
        </button>
      </div>

      <div class="cabinet-trim bottom-trim"></div>
    </section>

    <button class="paytable-toggle" id="paytable-toggle" aria-expanded="false">Paytable</button>

    <section class="paytable" id="paytable" hidden>
      <h2>Paytable</h2>
      <p class="paytable-note">3 matching symbols on an active payline.</p>
      <table>
        <thead>
          <tr><th>Symbol</th><th>3 in a row</th></tr>
        </thead>
        <tbody id="paytable-body"></tbody>
      </table>
      <p class="paytable-note small">Wins multiplied by your bet multiplier.</p>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <section id="clicker-screen" class="screen" hidden>
    <header class="topbar">
      <h1 class="neon-title small">Gold Mine</h1>
      <div class="balance-pill" aria-live="polite">
        <span class="coin-icon" aria-hidden="true"></span>
        <span id="clicker-balance">0</span>
      </div>
    </header>

    <div class="clicker-area">
      <p class="clicker-instructions">Tap the coin to earn gold.</p>
      <button id="big-coin" class="big-coin" aria-label="Click to earn one gold coin">
        <span class="big-coin-face">
          <span class="big-coin-mark">$</span>
        </span>
        <span class="big-coin-shadow" aria-hidden="true"></span>
      </button>
      <div class="clicker-stats">
        <div><span class="stat-label">Earned this visit:</span> <span id="clicker-session">0</span></div>
      </div>
      <button id="back-to-slots" class="ghost-btn">Back to Slots</button>
    </div>
  </section>

  <div id="win-banner" class="win-banner" hidden>
    <span class="win-banner-text"></span>
  </div>

  <nav class="tab-bar" role="navigation" aria-label="App navigation">
    <button class="tab-item" aria-current="page" aria-label="Lucky Slots">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="5" width="20" height="15" rx="2.5" stroke="currentColor" stroke-width="1.6" fill="none"/>
        <rect x="5"   y="8" width="4" height="6" rx="1" fill="currentColor" opacity="0.85"/>
        <rect x="10"  y="8" width="4" height="6" rx="1" fill="currentColor" opacity="0.85"/>
        <rect x="15"  y="8" width="4" height="6" rx="1" fill="currentColor" opacity="0.85"/>
        <line x1="2" y1="16" x2="22" y2="16" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="tab-label">Lucky Slots</span>
    </button>
  </nav>

  <script src="game.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
